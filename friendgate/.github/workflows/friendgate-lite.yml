name: FriendGate Lite

on:
  push:
    branches: [main]
    paths:
      - "lite/**"
      - "Dockerfile.lite"
      - "deploy/lite/**"
      - "FRIENDGATE_CN.md"
      - ".github/workflows/friendgate-lite.yml"
    tags: ["friendgate-v*"]
  pull_request:
    paths:
      - "lite/**"
      - "Dockerfile.lite"
      - "deploy/lite/**"
      - "FRIENDGATE_CN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # PBKDF2 deliberately uses production-strength iteration counts. Under the
    # race detector a slow shared runner can legitimately need more than eight
    # minutes even when there is no deadlock or race.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: lite/go.sum
      - run: go test -race -count=1 -timeout=20m ./...
      - run: go vet ./...
      - name: Validate Lite deployment files
        working-directory: .
        run: |
          bash -n deploy/lite/install.sh
          docker compose --env-file deploy/lite/.env.example \
            -f deploy/lite/docker-compose.yml config --quiet
          docker compose --env-file deploy/lite/.env.example \
            -f deploy/lite/docker-compose.yml \
            -f deploy/lite/docker-compose.nginx.yml config --quiet

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize GHCR namespace
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/friendgate
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
